name: Playwright E2E

# Runs Playwright on every PR + every push to main. The e2e suite hits a
# DEDICATED test Supabase project (NOT prod) — APT-52. The suite mutates
# matches.status / rounds.locked_at, which is unsafe against the live
# tournament DB once play starts (2026-06-11). The e2e admin client also
# enforces this in code via assertTestDatabase (e2e/helpers.ts), which
# refuses to run against the prod project ref.
#
# global-setup provisions a test user (e2e-test-<browser>@worldcupbracket.local
# in CI, plain e2e-test@worldcupbracket.local locally) and teardown deletes
# it. The seed (matches / teams / rounds / bracket_slots) is shared per
# project, so this still runs serially (see concurrency + max-parallel below);
# the test project is one shared DB across concurrent runs, exactly like
# prod was, so APT-47's serialization is still required.
#
# Required GitHub secrets (the dedicated test project's creds):
#   TEST_SUPABASE_URL
#   TEST_SUPABASE_ANON_KEY
#   TEST_SUPABASE_SERVICE_ROLE_KEY
# These are mapped into the standard NEXT_PUBLIC_* / SERVICE_ROLE env names
# below so the app build + runtime point at the test project.
#
# Optional repo variable:
#   E2E_PORT (default 3100) — port the test webServer binds to.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Single global queue — only one Playwright workflow run executes at a
  # time across the whole repo. The suite mutates shared seed rows
  # (rounds.locked_at, matches.status) on a single Supabase project, so
  # concurrent runs (matrix pair OR cross-PR) race each other's
  # afterAll restorations and leave the seed in a dirty state.
  # cancel-in-progress: false → new runs queue instead of preempting,
  # so stale-but-running CI on an old commit doesn't get cancelled when
  # a new commit lands. Acceptable for a hobby project where CI runtime
  # (~4 min) is small.
  group: playwright-shared-supabase
  cancel-in-progress: false

jobs:
  test:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Serialize chromium → webkit within the same workflow run. Both
      # jobs hit the same Supabase project and the same seed rows; if
      # they ran in parallel, the scoring-loop and round-lock specs would
      # mutate matches.status / rounds.locked_at simultaneously and one
      # would clobber the other's restoration. The cross-workflow
      # concurrency group above plus this max-parallel: 1 give end-to-end
      # serial execution against the shared DB.
      max-parallel: 1
      matrix:
        # Both browsers from APT-33 AC. WebKit catches Safari-specific
        # papercuts (iOS Safari is the family-beta hotspot per APT-38).
        browser: [chromium, webkit]

    env:
      # Dedicated test project (APT-52), mapped into the standard env names
      # the app + e2e read. Never point these at the prod project — the
      # assertTestDatabase guard (e2e/helpers.ts) will hard-fail if you do.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PORT: ${{ vars.E2E_PORT || '3100' }}
      # Per-run isolation — global-setup builds the test user email
      # as e2e-test-${E2E_USER_SUFFIX}@worldcupbracket.local.
      # browser + run_id + run_attempt is globally unique across:
      #   - the chromium/webkit matrix pair within one workflow run
      #   - concurrent workflow runs (different PRs racing CI)
      #   - retried jobs (run_attempt bumps)
      # See file header for the races this prevents.
      E2E_USER_SUFFIX: ${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 22 (LTS) has native WebSocket; @supabase/supabase-js refuses
          # to start on Node 20 without a polyfill ("Node.js 20 detected
          # without native WebSocket support"). Catches us in e2e because
          # globalSetup imports the admin client at the top of the file.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build Next.js (prod target — same path as Vercel)
        run: npm run build

      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
