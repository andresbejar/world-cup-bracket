name: Playwright E2E

# Runs Playwright on every PR + every push to main. The same Supabase
# project the deployed app uses gets hit by the e2e suite — global-setup
# provisions a dedicated test user (e2e-test-<browser>@worldcupbracket.local
# in CI, plain e2e-test@worldcupbracket.local locally) and teardown
# deletes it so prod data isn't polluted. The seed (matches / teams /
# rounds / bracket_slots) is read-only from the test's POV.
#
# Per-browser email is mandatory in CI: chromium and webkit jobs run in
# parallel against the same Supabase project; without isolation their
# setup/teardown race and one job's teardown deletes the other's user
# mid-run (APT-47).
#
# Required GitHub secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#
# Optional repo variable:
#   E2E_PORT (default 3100) — port the test webServer binds to.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per branch — kill stale runs when a new commit lands.
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both browsers from APT-33 AC. WebKit catches Safari-specific
        # papercuts (iOS Safari is the family-beta hotspot per APT-38).
        browser: [chromium, webkit]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PORT: ${{ vars.E2E_PORT || '3100' }}
      # Per-browser isolation — global-setup builds the test user email
      # as e2e-test-${E2E_USER_SUFFIX}@worldcupbracket.local. See file
      # header for the race this prevents.
      E2E_USER_SUFFIX: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) has native WebSocket; @supabase/supabase-js refuses
          # to start on Node 20 without a polyfill ("Node.js 20 detected
          # without native WebSocket support"). Catches us in e2e because
          # globalSetup imports the admin client at the top of the file.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build Next.js (prod target — same path as Vercel)
        run: npm run build

      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
