name: Daily Supabase backup

# APT-39: defense against a bad migration / accidental DELETE wiping
# predictions mid-tournament. Runs `pg_dump` daily against the production
# Supabase project, encrypts the dump with a symmetric GPG passphrase,
# and uploads it as a private GitHub Actions artifact (30-day retention).
#
# Why GitHub artifact instead of gist/S3:
#   - artifact lifecycle (upload-artifact@v4) is built-in, free, and
#     scoped to repo collaborators — same trust boundary as the secrets
#     that hold the DB URL.
#   - gists have a 1MB single-file soft limit; a full Supabase dump
#     compressed + encrypted will exceed that as predictions populate.
#   - S3 needs IAM + bucket lifecycle setup; overkill for a hobby project.
#   - Defense in depth: GPG-encrypt the dump anyway, so even an artifact
#     leak yields ciphertext.
#
# Recovery procedure: see CLAUDE.md § Backups & Recovery.
#
# Required GitHub secrets (set via: gh secret set <NAME>):
#   SUPABASE_DB_URL         — direct postgres URL with password, e.g.
#                              postgres://postgres:<pw>@db.<ref>.supabase.co:5432/postgres
#                              (use the Direct Connection, NOT the pooler — pg_dump
#                              needs a session connection.)
#   BACKUP_GPG_PASSPHRASE   — symmetric passphrase used to encrypt + decrypt
#                              dumps. Store somewhere outside GitHub too
#                              (password manager) — losing it means losing
#                              the backups.

on:
  schedule:
    # 05:13 UTC daily. Off-peak, away from the :00 cron-burst window
    # poll-results.yml lives in.
    - cron: '13 5 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client (PGDG)
        run: |
          set -euo pipefail
          # Supabase projects run PG 15-17. Ubuntu 24.04 ships
          # postgresql-client-16 which refuses to dump from a newer
          # server ("server version is X.Y; pg_dump version is 16"). Pull
          # the latest client from PGDG so we're forward-compatible.
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # On Ubuntu /usr/bin/pg_dump is the postgresql-common pg_wrapper
          # which can resolve to the older client-16 even after PGDG
          # installs 17. Print both to confirm and use the absolute PG17
          # path in the dump step below.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump public schema, gzip + GPG-encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${PASSPHRASE:-}" ]; then
            echo "ERROR: SUPABASE_DB_URL or BACKUP_GPG_PASSPHRASE is not set." >&2
            echo "  gh secret set SUPABASE_DB_URL" >&2
            echo "  gh secret set BACKUP_GPG_PASSPHRASE" >&2
            exit 1
          fi

          STAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          OUT="supabase-${STAMP}.sql"

          # --schema=public:     skip auth/storage/extensions schemas — they're
          #                      Supabase-managed and not ours to restore.
          # --no-owner --no-acl: portability when restoring into a fresh project
          #                      (the destination project's roles won't match).
          # --clean --if-exists: include DROP statements guarded by IF EXISTS so
          #                      a partial restore over a live DB is safe.
          # Output is plain SQL so a human can inspect / cherry-pick rows during
          # an incident. pg_dump's custom format is faster to restore but opaque.
          # Absolute path to the PG17 binary — /usr/bin/pg_dump is the
          # postgresql-common pg_wrapper which has been observed resolving
          # to the Ubuntu-default client-16 even after PGDG installs 17,
          # producing a "server version mismatch" error against Supabase's
          # PG 17.6 servers.
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-acl --clean --if-exists \
            --schema=public \
            > "$OUT"

          BYTES=$(wc -c < "$OUT")
          echo "Dump size (plain): $BYTES bytes"
          if [ "$BYTES" -lt 1024 ]; then
            echo "ERROR: dump is suspiciously small (<1KB). Aborting." >&2
            exit 1
          fi

          # Symmetric AES-256 with the repo passphrase. --batch + loopback
          # pinentry keeps GPG headless. The .gpg blob is what's uploaded.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --compress-algo zlib --compress-level 9 \
            --output "${OUT}.gpg" "$OUT"
          rm -f "$OUT"

          ls -lh "${OUT}.gpg"
          echo "DUMP_FILE=${OUT}.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.DUMP_FILE }}
          # 30 days covers any in-tournament incident-response window
          # (2026-06-11 → 2026-07-19). Older backups are dropped to keep
          # storage tidy.
          retention-days: 30
          if-no-files-found: error
