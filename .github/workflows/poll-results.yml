name: Poll match results (backstop)

# SPARSE BACKSTOP — not the primary trigger.
#
# Primary polling is an external every-5-min cron pinger (cron-job.org) that
# hits POST /api/cron/poll-results; the route self-throttles, only calling
# api-sports when a match is in its expected-end window (see APT-60 + the route
# header). That delivers scores within ~5 min of the final whistle.
#
# This workflow exists only as insurance and to run the non-result work that
# isn't tied to a match ending — knockout-fixture-id backfill and reality/
# finalist sweeps — on a steady cadence even between rounds. It calls the route
# with ?full=1 to BYPASS the self-throttle and force a complete sweep (backfill
# + re-score any stragglers + advance reality). Scoring is idempotent, so this
# overlapping with the pinger is safe.
#
# Why GitHub Actions (not Vercel Cron): Vercel Hobby is capped at one cron run
# per day (verified APT-3, 2026-05-09); Pro ($20/mo) is overkill for a hobby.
# GitHub's *scheduled* workflows are best-effort — delayed/dropped under load
# (a nominal `0 * * * *` fired only ~every 4h in practice, APT 2026-06), which
# is exactly why the every-match-end timing now lives in the external pinger and
# this is only a coarse safety net.
#
# Required GitHub secrets (set via: gh secret set <NAME>):
#   CRON_SECRET      — shared secret the API route validates before running
#   PROD_URL         — production base URL, e.g. https://example.vercel.app
#                       (set as a repo VARIABLE, not a secret, so it's visible
#                        in workflow logs for debugging)

on:
  schedule:
    # Every 3 hours at an off-peak minute (UTC, avoiding the congested :00).
    # Coarse on purpose — the external pinger handles match-end timing; this
    # just guarantees backfill/reality/straggler-scoring run between rounds even
    # if the pinger is down.
    - cron: '13 */3 * * *'

  # Manual trigger for testing or one-off catch-up runs after an outage.
  workflow_dispatch:

# Cancel in-flight runs if a new one starts (avoid double-scoring during catch-up).
concurrency:
  group: poll-results
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/poll-results?full=1 (force complete sweep)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PROD_URL" ]; then
            echo "ERROR: CRON_SECRET or PROD_URL is not configured." >&2
            echo "Set them with:" >&2
            echo "  gh secret set CRON_SECRET" >&2
            echo "  gh variable set PROD_URL" >&2
            exit 1
          fi

          # Capture status + body separately so we can fail loudly on non-2xx.
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$PROD_URL/api/cron/poll-results?full=1")

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "ERROR: poll-results returned non-2xx status." >&2
            exit 1
          fi
